name: Docker Multi-Arch

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}-build-${{ github.run_number }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and optionally push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RTL_HAOS_BUILD=${{ github.sha }}
          provenance: false

      - name: Comment PR image tag
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}-build-${{ github.run_number }}
        run: |
          set -euo pipefail

          image="ghcr.io/${REPOSITORY}:${IMAGE_TAG}"
          marker="<!-- rtl-haos-pr-image -->"

          body=$(cat <<EOF
          ${marker}
          ## PR test image

          Pull the immutable image generated by this PR build:

          \`\`\`bash
          docker pull ${image}
          \`\`\`

          Example:

          \`\`\`bash
          docker run -d \\
            --name rtl-haos-pr-${PR_NUMBER} \\
            --restart unless-stopped \\
            --env-file /path/to/test.env \\
            ${image}
          \`\`\`

          Image tag: \`${IMAGE_TAG}\`
          EOF
          )

          existing_id=$(
            gh api --paginate \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- rtl-haos-pr-image -->")) | .id' |
            head -n 1
          )

          if [ -n "${existing_id}" ]; then
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${existing_id}" \
              -f body="${body}" >/dev/null
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body "${body}"
          fi
